<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>កំណត់ចំណាំ · ស្ទីគ័រពណ៌ + រូបភាព + តេឡេក្រាម</title>
  <!-- Bootstrap 5 CSS + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    @font-face { font-family: 'Khmer OS Moul Light'; src: local('Khmer OS Moul Light'), local('KhmerOSMoulLight'); font-weight: normal; font-style: normal; }
    @font-face { font-family: 'Khmer OS Battambang'; src: local('Khmer OS Battambang'), local('KhmerOSBattambang'); font-weight: normal; font-style: normal; }
    :root {
      --bg-body: #e2d9ce; --bg-app: #faf6ef; --bg-topbar: rgba(255, 251, 240, 0.96); --border-color: #e5d8c4;
      --bg-search: #f3ede2; --search-input-bg: #ffffff; --search-border: #e0d0ba; --text-primary: #3e2b1a;
      --text-secondary: #7b644a; --card-bg: #fffdf7; --card-border: #f0e5d4; --card-text: #3f3325;
      --preview-bg: rgba(151, 113, 79, 0.1); --footer-color: #b69a78; --icon-color: #4f3a28;
      --icon-btn-bg: #efe3d2; --icon-btn-active: #e2d2be; --shadow-sm: rgba(0, 0, 0, 0.04);
      --popup-bg: #faf6ef; --input-border: #e0d0ba; --btn-save: #8b694c; --btn-cancel: #e7ddce;
      --modal-overlay: rgba(0, 0, 0, 0.5); --modal-bg: #fffef7; --modal-text: #3e2b1a;
      --header-font: 'Khmer OS Moul Light', 'Inter', system-ui, sans-serif;
      --body-font: 'Khmer OS Battambang', 'Inter', system-ui, sans-serif;
      --bottom-bar-bg: rgba(255, 251, 240, 0.96);
    }
    body.dark {
      --bg-body: #1a1a1a; --bg-app: #1e1e1e; --bg-topbar: #2c2c2c; --border-color: #3a3a3a;
      --bg-search: #252525; --search-input-bg: #333333; --search-border: #444444; --text-primary: #e0e0e0;
      --text-secondary: #aaaaaa; --card-bg: #2a2a2a; --card-border: #3d3d3d; --card-text: #dddddd;
      --preview-bg: rgba(200, 180, 140, 0.15); --footer-color: #888888; --icon-color: #cccccc;
      --icon-btn-bg: #3d3d3d; --icon-btn-active: #4a4a4a; --shadow-sm: rgba(0, 0, 0, 0.2);
      --popup-bg: #2a2a2a; --input-border: #555555; --btn-save: #a07858; --btn-cancel: #4a4a4a;
      --modal-overlay: rgba(0, 0, 0, 0.7); --modal-bg: #2a2a2a; --modal-text: #e0e0e0; --bottom-bar-bg: #2c2c2c;
    }
    body { background: var(--bg-body); font-family: var(--body-font); height: 100vh; width: 100vw; overflow: hidden; position: fixed; transition: background 0.3s ease; }
    .app-container { height: 100%; width: 100%; background: var(--bg-app); display: flex; flex-direction: column; overflow: hidden; }
    .top-bar { background: var(--bg-topbar); backdrop-filter: blur(12px); padding: 0.5rem 1rem; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
    .logo-area { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .short-title { font-size: 0.85rem; font-weight: 800; font-family: var(--header-font); background: linear-gradient(135deg, #c9ad85, #e0c8a8); background-clip: text; -webkit-background-clip: text; color: transparent; padding: 0.2rem 0.6rem; border-radius: 40px; white-space: nowrap; }
    .search-box { flex: 1; min-width: 140px; position: relative; }
    .search-box input { width: 100%; padding: 0.5rem 0.8rem 0.5rem 2rem; border-radius: 2rem; border: 1px solid var(--search-border); background: var(--search-input-bg); color: var(--text-primary); font-size: 0.75rem; font-family: var(--body-font); }
    .search-box .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 0.8rem; color: var(--text-secondary); }
    .action-icons { display: flex; gap: 0.4rem; align-items: center; }
    .icon-btn { background: var(--icon-btn-bg); border: none; width: 36px; height: 36px; border-radius: 40px; display: flex; align-items: center; justify-content: center; font-size: 1rem; cursor: pointer; color: var(--icon-color); transition: all 0.2s; }
    .icon-btn:active { transform: scale(0.95); }
    .stats-row { display: flex; justify-content: space-between; align-items: baseline; padding: 0.2rem 1rem; background: var(--bg-search); font-size: 0.6rem; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
    .notes-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; padding: 0.8rem; overflow-y: auto; flex: 1; align-content: start; }
    .note-card { border-radius: 1.2rem; padding: 0.7rem 0.6rem 0.6rem; box-shadow: 0 2px 8px var(--shadow-sm); border: 1px solid var(--card-border); transition: all 0.2s ease; cursor: pointer; }
    .note-card:active { transform: scale(0.98); }
    .card-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem; }
    .left-title { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
    .pin-mini { background: none; border: none; font-size: 0.8rem; width: 24px; height: 24px; border-radius: 30px; cursor: pointer; color: var(--footer-color); }
    .pin-mini.active-pin { color: #f0a500; }
    .title-text { font-weight: 700; font-size: 0.7rem; background: var(--preview-bg); padding: 0.15rem 0.45rem; border-radius: 30px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; }
    .card-actions { display: flex; gap: 3px; }
    .icon-small { background: rgba(0,0,0,0.08); border: none; width: 26px; height: 26px; border-radius: 30px; font-size: 0.65rem; cursor: pointer; color: var(--icon-color); }
    .note-body-preview { font-size: 0.62rem; line-height: 1.35; color: var(--card-text); margin: 0.3rem 0 0.2rem; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .note-img-preview { margin-top: 5px; max-height: 60px; border-radius: 12px; overflow: hidden; display: flex; justify-content: center; }
    .note-img-preview img { width: 100%; height: auto; max-height: 60px; object-fit: cover; border-radius: 10px; border: 1px solid rgba(0,0,0,0.1); }
    .card-footer { margin-top: 0.3rem; font-size: 0.45rem; color: var(--footer-color); display: flex; justify-content: space-between; border-top: 0.5px solid var(--card-border); padding-top: 0.3rem; }
    .empty-msg { grid-column: span 2; text-align: center; padding: 2rem; font-size: 0.75rem; color: var(--text-secondary); }
    .bottom-bar { flex-shrink: 0; background: var(--bottom-bar-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--border-color); padding: 0.5rem 1rem; display: flex; justify-content: center; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
    .file-action-btn { background: var(--btn-save); border: none; padding: 0.5rem 1rem; border-radius: 2rem; color: white; font-size: 0.7rem; font-weight: 600; display: inline-flex; align-items: center; gap: 0.4rem; cursor: pointer; transition: transform 0.2s; }
    .file-action-btn:active { transform: scale(0.96); }
    .color-sticker-section { margin: 0.4rem 0; }
    .color-label { font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 0.2rem; }
    .color-palette { display: flex; gap: 0.5rem; flex-wrap: wrap; padding: 0.2rem 0; }
    .color-option { width: 36px; height: 36px; border-radius: 30px; cursor: pointer; border: 2px solid transparent; transition: transform 0.1s; }
    .color-option.selected { border: 2px solid white; box-shadow: 0 0 0 2px var(--btn-save); transform: scale(1.05); }
    .image-upload-area { background: var(--icon-btn-bg); border-radius: 1rem; padding: 0.5rem; margin: 0.5rem 0; display: flex; flex-direction: column; gap: 0.4rem; }
    .upload-btn { background: var(--btn-save); border: none; padding: 0.4rem 0.8rem; border-radius: 2rem; color: white; font-size: 0.7rem; display: inline-flex; align-items: center; gap: 6px; width: fit-content; cursor: pointer; }
    .current-image-preview { max-width: 100%; max-height: 150px; border-radius: 16px; margin-top: 5px; border: 1px solid var(--border-color); background: #fff; }
    .remove-img-btn { background: none; border: none; color: #dc2626; font-size: 0.7rem; cursor: pointer; margin-left: 8px; }
    .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); z-index: 6000; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; }
    .loading-spinner { width: 60px; height: 60px; border: 4px solid rgba(5,4,4,0.3); border-top: 4px solid var(--btn-save); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loading-text { color: white; font-size: 0.9rem; font-weight: 500; background: rgba(0,0,0,0.6); padding: 0.3rem 1rem; border-radius: 2rem; }
    .fullscreen-popup, .full-reader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--popup-bg); z-index: 3000; }
    .popup-card, .reader-full { background: var(--popup-bg); width: 100%; height: 100%; display: flex; flex-direction: column; padding: 1.2rem; overflow-y: auto; }
    .popup-header, .reader-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; padding-bottom: 0.4rem; border-bottom: 1px solid var(--border-color); }
    .popup-header h2, .reader-header h2 { font-size: 1.3rem; color: var(--text-primary); font-family: var(--header-font); }
    .close-popup-x, .close-reader-x { background: none; border: none; font-size: 1.6rem; cursor: pointer; color: var(--text-secondary); width: 40px; height: 40px; }
    .popup-card input, .popup-card textarea { width: 100%; padding: 0.8rem; margin: 0.5rem 0; border-radius: 1rem; border: 1.5px solid var(--input-border); font-size: 0.9rem; background: var(--search-input-bg); color: var(--text-primary); font-family: var(--body-font); }
    .popup-card textarea { flex: 1; resize: none; min-height: 140px; }
    .popup-actions { display: flex; justify-content: flex-end; gap: 0.8rem; margin-top: 0.8rem; }
    .popup-actions button { padding: 0.6rem 1.4rem; border-radius: 2rem; border: none; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
    .btn-popup-save { background: var(--btn-save); color: white; }
    .btn-popup-cancel { background: var(--btn-cancel); color: var(--text-primary); }
    .reader-full-content { font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; color: var(--card-text); margin: 0.8rem 0; flex: 1; }
    .reader-image-area { margin: 10px 0; text-align: center; }
    .reader-image-area img { max-width: 100%; max-height: 300px; border-radius: 24px; border: 1px solid var(--border-color); }
    .reader-full-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 0.8rem; padding-top: 0.6rem; border-top: 1px solid var(--border-color); }
    .custom-confirm { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--modal-overlay); backdrop-filter: blur(4px); z-index: 4000; align-items: center; justify-content: center; }
    .confirm-dialog { background: var(--modal-bg); border-radius: 1.5rem; padding: 1.5rem; width: 80%; max-width: 300px; text-align: center; }
    .confirm-dialog p { margin-bottom: 1.2rem; font-size: 0.9rem; color: var(--modal-text); }
    .confirm-buttons { display: flex; gap: 0.8rem; justify-content: center; }
    .confirm-buttons button { padding: 0.5rem 1.2rem; border-radius: 2rem; border: none; font-weight: 600; cursor: pointer; }
    .confirm-yes { background: var(--btn-save); color: white; }
    .confirm-no { background: var(--btn-cancel); color: var(--text-primary); }
    .toast-custom { position: fixed; bottom: 80px; left: 20px; right: 20px; background: var(--btn-save); color: white; text-align: center; padding: 10px; border-radius: 30px; font-size: 0.75rem; z-index: 5000; animation: fadeInUp 0.3s ease; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div class="app-container">
  <div class="top-bar">
    <div class="logo-area" id="logoArea"><span class="short-title">កំណត់ចំណាំ</span></div>
    <div class="search-box"><span class="search-icon">🔍</span><input type="text" id="searchInput" placeholder="ស្វែងរកតាមចំណងជើង..."></div>
    <div class="action-icons"><button class="icon-btn" id="themeToggleBtn"><i class="bi bi-moon-stars"></i></button><button class="icon-btn" id="newNoteFullscreenBtn"><i class="bi bi-plus-lg"></i></button></div>
  </div>
  <div class="stats-row"><span class="note-count" id="statsCount">📌 កំណត់ហេតុ</span><span><i class="bi bi-telegram"></i> ផ្ញើរូបភាព</span></div>
  <div class="notes-grid" id="notesGrid"></div>
  <div class="bottom-bar" id="bottomBar">
    <button class="file-action-btn" id="exportNotesBtn"><i class="bi bi-save"></i> រក្សាទុក notesData.js</button>
    <button class="file-action-btn" id="importNotesBtn"><i class="bi bi-folder-symlink"></i> បើក notesData.js</button>
    <input type="file" id="importFileInput" accept=".js" style="display:none">
    <button class="file-action-btn" id="clearAllBtn" style="background:#b91c1c"><i class="bi bi-trash3"></i> លុបទាំងអស់</button>
  </div>
</div>
<div id="loadingOverlay" class="loading-overlay"><div class="loading-spinner"></div><div class="loading-text" id="loadingText">កំពុងដំណើរការ...</div></div>
<div id="fullscreenPopup" class="fullscreen-popup"><div class="popup-card"><div class="popup-header"><h2 id="popupTitle">✨ កំណត់ហេតុថ្មី</h2><button class="close-popup-x" id="popupCloseX">✕</button></div><input type="text" id="popupTitleInput" placeholder="ចំណងជើង"><textarea id="popupBodyInput" rows="4" placeholder="សរសេរកំណត់ហេតុ..."></textarea><div class="image-upload-area"><button class="upload-btn" id="uploadImageBtn"><i class="bi bi-image"></i> បន្ថែមរូបភាព</button><input type="file" id="imageFileInput" accept="image/jpeg,image/png,image/gif,image/webp" style="display:none"><div id="imagePreviewContainer"></div></div><div class="color-sticker-section"><div class="color-label">🎨 ពណ៌ស្ទីគ័រ</div><div class="color-palette" id="colorPalette"></div></div><div class="popup-actions"><button class="btn-popup-cancel" id="popupCancelBtn">បោះបង់</button><button class="btn-popup-save" id="popupSaveBtn">រក្សាទុក</button></div></div></div>
<div id="fullReader" class="full-reader"><div class="reader-full"><div class="reader-header"><h2 id="readerTitle"></h2><button class="close-reader-x" id="closeReaderX">✕</button></div><div id="readerImageArea" class="reader-image-area"></div><div id="readerContent" class="reader-full-content"></div><div class="reader-full-footer"><span id="readerDate"></span><button class="btn btn-sm btn-danger" id="deleteFromReaderBtn"><i class="bi bi-trash3"></i></button></div></div></div>
<div id="customConfirm" class="custom-confirm"><div class="confirm-dialog"><p id="confirmMessage">លុបកំណត់ហេតុនេះ?</p><div class="confirm-buttons"><button class="confirm-yes" id="confirmYesBtn">បាទ</button><button class="confirm-no" id="confirmNoBtn">ទេ</button></div></div></div>

<script>
  const BOT_TOKEN = '8930473093:AAFcb_mDHowfLzR9Eo0oqmGTks3kyXflBqU';
  let CHAT_ID = null;
  const STORAGE_KEY = 'queasy_sticker_images_v3';
  const THEME_KEY = 'queasy_theme_khmer';
  const STICKER_COLORS = ['#FFE8D6', '#FFD6E0', '#C9E4DE', '#C2E0F0', '#FCE1B3', '#E0D3FF', '#FBC8B5', '#C4E6F1', '#F9E6B3', '#D4F1F9', '#FFDDCC', '#E2F0CB', '#FFC8A2', '#D9E5FF', '#FADADD', '#BDE0FE'];
  const DARK_STICKER_COLORS = ['#3d3d3d', '#4a3a3a', '#2d4a4a', '#2d3a5a', '#5a4a2a', '#4a3a6a', '#5a3a3a', '#3a5a5a', '#5a4a3a', '#3a5a4a', '#5a3a4a', '#4a5a3a', '#6a4a3a', '#3a4a6a', '#5a3a5a', '#3a5a6a'];

  let notes = [];
  let selectedStickerColor = STICKER_COLORS[0];
  let currentSearchQuery = '';
  let currentImageDataUrl = null;
  let editingId = null;

  function showLoading(msg) { const o=document.getElementById('loadingOverlay'); document.getElementById('loadingText').textContent=msg; o.style.display='flex'; }
  function hideLoading() { document.getElementById('loadingOverlay').style.display='none'; }
  function showToast(msg, isErr=false) { const t=document.createElement('div'); t.className='toast-custom'; t.style.background=isErr?'#dc2626':'var(--btn-save)'; t.innerHTML=`<i class="bi ${isErr?'bi-exclamation-triangle':'bi-check-circle'}"></i> ${msg}`; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
  function genId() { return Date.now()+'-'+Math.random().toString(36).substring(2,8); }
  function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>]/g, c=>c==='&'?'&amp;':c==='<'?'&lt;':'&gt;'); }
  function escapeMarkdown(text) { if(!text) return ''; return text.replace(/[_*[\]()~`>#+\-=|{}.!]/g, '\\$&'); }

  function compressImage(dataUrl, maxWidth=800, quality=0.7) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width, height = img.height;
        if(width > maxWidth) { height = (height * maxWidth) / width; width = maxWidth; }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = dataUrl;
    });
  }

  async function sendToTelegramWithImage(title, content, imageDataUrl, action, dateStr) {
    try { await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getMe`); } catch(e) { showToast('Bot error',true); return false; }
    if(!CHAT_ID) { await getUpdates(); if(!CHAT_ID) { showToast('សូមផ្ញើសារទៅកាន់ Telegram Bot សិន',true); return false; } }
    const caption = `${action === 'new' ? '📝 កំណត់ហេតុថ្មី' : '✏️ កែសម្រួល'}\n\n📌 ${escapeMarkdown(title)}\n\n📄 ${escapeMarkdown(content.substring(0,800))}\n\n📅 ${dateStr}`.substring(0,1024);
    if(imageDataUrl) {
      const blob = await (await fetch(imageDataUrl)).blob();
      const formData = new FormData();
      formData.append('chat_id', CHAT_ID);
      formData.append('photo', blob, 'note_image.jpg');
      formData.append('caption', caption);
      try {
        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
        const data = await res.json();
        if(data.ok) { showToast('បានផ្ញើរូបភាពទៅ Telegram'); return true; }
        else { showToast('ផ្ញើរូបភាពមិនជោគជ័យ',true); return false; }
      } catch(e) { showToast('បរាជ័យ',true); return false; }
    } else {
      const text = `${action === 'new' ? '📝 កំណត់ហេតុថ្មី' : '✏️ កែសម្រួល'}\n\n📌 ${title}\n\n📄 ${content}\n\n📅 ${dateStr}`;
      const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ chat_id:CHAT_ID, text:text.substring(0,4096) }) });
      const data = await res.json();
      if(data.ok) { showToast('បានផ្ញើទៅ Telegram'); return true; }
      return false;
    }
  }

  async function getUpdates() { try { const res=await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`); const data=await res.json(); if(data.ok && data.result.length>0) { CHAT_ID=data.result[data.result.length-1].message.chat.id; return true; } } catch(e){} return false; }

  // CRUD Core Functions
  function loadData() { 
    const stored = localStorage.getItem(STORAGE_KEY); 
    if(stored) { 
      try { 
        let p = JSON.parse(stored); 
        if(Array.isArray(p)) { 
          notes = p.map(n=>({...n, pinned:n.pinned===true, imageDataUrl:n.imageDataUrl||null})); 
          return; 
        } 
      } catch(e){} 
    } 
    // Default sample data
    notes = [
      { id: genId(), title: "ស្វាគមន៍!", content: "សូមស្វាគមន៍មកកាន់កម្មវិធីកំណត់ចំណាំ។ អ្នកអាចបន្ថែមរូបភាព ផ្លាស់ប្តូរពណ៌ និងផ្ញើទៅ Telegram ។", pinned: true, stickerColor: STICKER_COLORS[0], createdAt: Date.now(), imageDataUrl: null },
      { id: genId(), title: "របៀបប្រើប្រាស់", content: "ចុច + ដើម្បីបង្កើតកំណត់ហេតុថ្មី។ អ្នកអាចបន្ថែមរូបភាព និងជ្រើសរើសពណ៌ស្ទីគ័រ។ ចុចប៊ូតុងរក្សាទុក notesData.js ដើម្បីបម្រុងទុកទិន្នន័យ។", pinned: false, stickerColor: STICKER_COLORS[3], createdAt: Date.now() - 86400000, imageDataUrl: null }
    ];
    saveData();
  }
  function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); renderGrid(); }
  
  // Export to notesData.js file
  function exportToJSFile() {
    const exportData = notes.map(n => ({ 
      id: n.id, title: n.title, content: n.content, pinned: n.pinned, 
      stickerColor: n.stickerColor, createdAt: n.createdAt, imageDataUrl: n.imageDataUrl || null 
    }));
    const fileContent = `// ============================================\n// NOTES DATA FILE - Generated by Sticky Notes App\n// Date: ${new Date().toLocaleString()}\n// ============================================\n\nconst notesData = ${JSON.stringify(exportData, null, 2)};\n\n// Export for use in app\nif (typeof module !== 'undefined' && module.exports) { module.exports = notesData; }\n\n// To restore: click "បើក notesData.js" button and select this file\nconsole.log('📝 Notes data loaded:', notesData.length, 'notes');`;
    const blob = new Blob([fileContent], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'notesData.js';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`បានរក្សាទុក notesData.js ដោយជោគជ័យ! (${notes.length} កំណត់ហេតុ)`);
  }
  
  // Import from notesData.js file
  function importFromJSFile(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        let content = e.target.result;
        // Extract JSON array from the JS file
        let match = content.match(/notesData\s*=\s*(\[[\s\S]*?\]);/);
        if (!match) match = content.match(/(\[[\s\S]*?\]);?\s*$/);
        if (match) {
          const importedNotes = JSON.parse(match[1]);
          if (Array.isArray(importedNotes) && importedNotes.length >= 0) {
            notes = importedNotes.map(n => ({ 
              ...n, 
              pinned: n.pinned === true, 
              imageDataUrl: n.imageDataUrl || null,
              id: n.id || genId()
            }));
            saveData();
            showToast(`បានបើកឯកសារដោយជោគជ័យ! (${notes.length} កំណត់ហេតុ)`);
          } else throw new Error('Invalid format');
        } else throw new Error('No valid notes array found');
      } catch(err) { showToast('ឯកសារមិនត្រឹមត្រូវ ឬខូចទ្រង់ទ្រាយ', true); }
    };
    reader.readAsText(file);
  }
  
  // Clear all data
  function clearAllData() {
    notes = [];
    saveData();
    closeReader();
    showToast('បានលុបកំណត់ហេតុទាំងអស់ដោយជោគជ័យ!');
  }

  function filterSearch() { if(!currentSearchQuery.trim()) return [...notes]; const q=currentSearchQuery.toLowerCase(); return notes.filter(n=>n.title.toLowerCase().includes(q)); }
  function sortNotes(arr) { return [...arr].sort((a,b)=>{ if(a.pinned && !b.pinned) return -1; if(!a.pinned && b.pinned) return 1; return b.createdAt - a.createdAt; }); }

  function renderGrid() {
    const filtered=filterSearch(), sorted=sortNotes(filtered), grid=document.getElementById('notesGrid'), counterSpan=document.getElementById('statsCount');
    if(!sorted.length) { grid.innerHTML=`<div class="empty-msg"><i class="bi bi-journal-bookmark-fill"></i> គ្មានកំណត់ហេតុ · ចុច + ដើម្បីបង្កើត</div>`; counterSpan.innerText=currentSearchQuery?`🔍 0 លទ្ធផល`:`📭 0 កំណត់ហេតុ`; return; }
    counterSpan.innerText=currentSearchQuery?`🔍 ${sorted.length} លទ្ធផល`:`📚 ${sorted.length} កំណត់ហេតុ · ${sorted.filter(n=>n.pinned).length} ភ្ជាប់`;
    let html='';
    sorted.forEach(n=>{
      const bg=n.stickerColor||STICKER_COLORS[0];
      const titleShort=escapeHtml(n.title).substring(0,20)||'គ្មានចំណងជើង';
      const preview=escapeHtml(n.content).substring(0,60)||'...';
      const pinClass=n.pinned?'active-pin':'';
      const dateLabel=new Date(n.createdAt).toLocaleDateString('km-KH',{month:'short',day:'numeric'});
      let imgHtml='';
      if(n.imageDataUrl) imgHtml=`<div class="note-img-preview"><img src="${n.imageDataUrl}" loading="lazy" alt="img"></div>`;
      html+=`<div class="note-card" data-note-id="${n.id}" style="background: ${bg};"><div class="card-header-row"><div class="left-title"><button class="pin-mini ${pinClass}" data-id="${n.id}">${n.pinned?'📌':'📍'}</button><span class="title-text">${titleShort}</span></div><div class="card-actions"><button class="icon-small" data-id="${n.id}" data-action="edit"><i class="bi bi-pencil"></i></button><button class="icon-small" data-id="${n.id}" data-action="delete"><i class="bi bi-trash3"></i></button></div></div><div class="note-body-preview">${preview}</div>${imgHtml}<div class="card-footer"><span>📅 ${dateLabel}</span><span>${n.pinned?'⭐':'🎨'}</span></div></div>`;
    });
    grid.innerHTML=html;
    document.querySelectorAll('.pin-mini').forEach(btn=>btn.addEventListener('click',async(e)=>{ e.stopPropagation(); await togglePin(btn.dataset.id); }));
    document.querySelectorAll('.icon-small[data-action="edit"]').forEach(btn=>btn.addEventListener('click',(e)=>{ e.stopPropagation(); openEditPopup(btn.dataset.id); }));
    document.querySelectorAll('.icon-small[data-action="delete"]').forEach(btn=>btn.addEventListener('click',(e)=>{ e.stopPropagation(); showConfirm("លុបកំណត់ហេតុនេះ?",()=>deleteNote(btn.dataset.id),null); }));
    document.querySelectorAll('.note-card').forEach(card=>card.addEventListener('click',(e)=>{ if(e.target.closest('.pin-mini')||e.target.closest('.icon-small')) return; openFullscreenReader(card.dataset.noteId); }));
  }

  async function togglePin(id) { showLoading('កំពុងភ្ជាប់...'); await new Promise(r=>setTimeout(r,200)); const n=notes.find(n=>n.id===id); if(n) n.pinned=!n.pinned; saveData(); hideLoading(); }
  async function deleteNote(id) { showLoading('កំពុងលុប...'); await new Promise(r=>setTimeout(r,200)); notes=notes.filter(n=>n.id!==id); saveData(); if(document.getElementById('fullReader').style.display==='flex') closeReader(); hideLoading(); showToast('បានលុប'); }

  async function addNewNote(title,content,imageDataUrl,stickerColor) { if(!title.trim()&&!content.trim()&&!imageDataUrl) { alert("សូមបញ្ចូលចំណងជើង ឬខ្លឹមសារ ឬរូបភាព"); return false; } const now=Date.now(); const newNote={ id:genId(), title:title.trim()||"កំណត់ហេតុ", content:content.trim()||" ", pinned:false, stickerColor:stickerColor||STICKER_COLORS[0], createdAt:now, imageDataUrl:imageDataUrl||null }; notes.unshift(newNote); saveData(); const dateStr=new Date(now).toLocaleString('km-KH',{ dateStyle:'full', timeStyle:'short' }); await sendToTelegramWithImage(newNote.title, newNote.content, newNote.imageDataUrl, 'new', dateStr); return true; }
  async function updateNote(id,newTitle,newContent,newImageDataUrl,newStickerColor) { const idx=notes.findIndex(n=>n.id===id); if(idx!==-1) { if(!newTitle.trim()&&!newContent.trim()&&!newImageDataUrl) { alert("កំណត់ហេតុមិនអាចទទេ"); return false; } notes[idx].title=newTitle.trim()||"គ្មានចំណងជើង"; notes[idx].content=newContent.trim()||"(ទទេ)"; if(newStickerColor) notes[idx].stickerColor=newStickerColor; notes[idx].imageDataUrl=newImageDataUrl||null; saveData(); const dateStr=new Date(notes[idx].createdAt).toLocaleString('km-KH',{ dateStyle:'full',timeStyle:'short' }); await sendToTelegramWithImage(notes[idx].title, notes[idx].content, notes[idx].imageDataUrl, 'edit', dateStr); return true; } return false; }

  const popup=document.getElementById('fullscreenPopup'), popupTitle=document.getElementById('popupTitle'), titleInput=document.getElementById('popupTitleInput'), bodyInput=document.getElementById('popupBodyInput'), saveBtn=document.getElementById('popupSaveBtn'), cancelBtn=document.getElementById('popupCancelBtn'), closeX=document.getElementById('popupCloseX'), uploadBtn=document.getElementById('uploadImageBtn'), imageFileInput=document.getElementById('imageFileInput'), imagePreviewContainer=document.getElementById('imagePreviewContainer');
  function updateImagePreview(dataUrl) { currentImageDataUrl=dataUrl; imagePreviewContainer.innerHTML=''; if(dataUrl) { const div=document.createElement('div'); div.className='image-preview-container'; div.innerHTML=`<img src="${dataUrl}" class="current-image-preview" style="max-width:100%; max-height:120px; border-radius:16px;"><button type="button" class="remove-img-btn" id="removeCurrentImage"><i class="bi bi-x-circle"></i> លុបរូប</button>`; imagePreviewContainer.appendChild(div); document.getElementById('removeCurrentImage')?.addEventListener('click',()=>{ currentImageDataUrl=null; updateImagePreview(null); }); } else { imagePreviewContainer.innerHTML=''; } }
  function openCreatePopup() { editingId=null; popupTitle.innerText='✨ កំណត់ហេតុថ្មី'; titleInput.value=''; bodyInput.value=''; currentImageDataUrl=null; updateImagePreview(null); selectedStickerColor=document.body.classList.contains('dark')?DARK_STICKER_COLORS[0]:STICKER_COLORS[0]; renderColorPalette(); popup.style.display='flex'; }
  async function openEditPopup(id) { const note=notes.find(n=>n.id===id); if(!note) return; editingId=id; popupTitle.innerText='✏️ កែសម្រួល'; titleInput.value=note.title; bodyInput.value=note.content; currentImageDataUrl=note.imageDataUrl||null; updateImagePreview(currentImageDataUrl); selectedStickerColor=note.stickerColor||STICKER_COLORS[0]; renderColorPalette(); popup.style.display='flex'; }
  function closePopup() { popup.style.display='none'; editingId=null; currentImageDataUrl=null; }
  async function handleSave() { showLoading(editingId?'កំពុងកែសម្រួល...':'កំពុងរក្សាទុក...'); let finalImg=currentImageDataUrl; if(finalImg && finalImg.startsWith('data:image') && finalImg.length>1000000) { finalImg=await compressImage(finalImg, 800, 0.7); } if(editingId) await updateNote(editingId, titleInput.value, bodyInput.value, finalImg, selectedStickerColor); else await addNewNote(titleInput.value, bodyInput.value, finalImg, selectedStickerColor); hideLoading(); closePopup(); }
  uploadBtn.addEventListener('click',()=>imageFileInput.click()); imageFileInput.addEventListener('change', async (e)=>{ const file=e.target.files[0]; if(file && file.type.startsWith('image/')) { showLoading('កំពុងដំណើរការរូបភាព...'); const reader=new FileReader(); reader.onload=async (ev)=>{ let compressed=await compressImage(ev.target.result, 800, 0.7); currentImageDataUrl=compressed; updateImagePreview(currentImageDataUrl); hideLoading(); }; reader.readAsDataURL(file); } else if(file){ alert('សូមជ្រើសរូបភាព'); } });
  saveBtn.addEventListener('click',handleSave); cancelBtn.addEventListener('click',closePopup); closeX.addEventListener('click',closePopup); popup.addEventListener('click',(e)=>{if(e.target===popup) closePopup();});
  document.getElementById('newNoteFullscreenBtn').addEventListener('click',openCreatePopup);

  const reader=document.getElementById('fullReader'), readerTitle=document.getElementById('readerTitle'), readerContent=document.getElementById('readerContent'), readerDate=document.getElementById('readerDate'), readerImageArea=document.getElementById('readerImageArea'), closeReaderX=document.getElementById('closeReaderX'), deleteReaderBtn=document.getElementById('deleteFromReaderBtn'); let currentReaderId=null;
  function openFullscreenReader(id) { const note=notes.find(n=>n.id===id); if(!note) return; currentReaderId=id; readerTitle.innerText=note.title; readerContent.innerText=note.content; readerDate.innerHTML=`<i class="bi bi-calendar"></i> ${new Date(note.createdAt).toLocaleString('km-KH',{dateStyle:'full',timeStyle:'short'})} ${note.pinned?'📌':''}`; readerImageArea.innerHTML=''; if(note.imageDataUrl) readerImageArea.innerHTML=`<img src="${note.imageDataUrl}" alt="attachment" style="max-width:100%; border-radius:20px;">`; else readerImageArea.innerHTML='<div class="text-muted small">គ្មានរូបភាព</div>'; reader.style.display='flex'; }
  function closeReader() { reader.style.display='none'; currentReaderId=null; }
  closeReaderX.addEventListener('click',closeReader); deleteReaderBtn.addEventListener('click',()=>{ if(currentReaderId) showConfirm("លុបកំណត់ហេតុនេះ?",()=>deleteNote(currentReaderId),null); }); reader.addEventListener('click',(e)=>{if(e.target===reader)closeReader();});

  function renderColorPalette() { const isDark=document.body.classList.contains('dark'); const colors=isDark?DARK_STICKER_COLORS:STICKER_COLORS; const palette=document.getElementById('colorPalette'); if(!palette) return; palette.innerHTML=''; colors.forEach(color=>{ const opt=document.createElement('div'); opt.className='color-option'; if(selectedStickerColor===color) opt.classList.add('selected'); opt.style.backgroundColor=color; opt.addEventListener('click',()=>{ document.querySelectorAll('.color-option').forEach(o=>o.classList.remove('selected')); opt.classList.add('selected'); selectedStickerColor=color; }); palette.appendChild(opt); }); }
  function initTheme() { const saved=localStorage.getItem(THEME_KEY); if(saved==='dark'){ document.body.classList.add('dark'); document.getElementById('themeToggleBtn').innerHTML='<i class="bi bi-sun"></i>'; } else { document.body.classList.remove('dark'); document.getElementById('themeToggleBtn').innerHTML='<i class="bi bi-moon-stars"></i>'; } renderColorPalette(); renderGrid(); }
  function toggleTheme() { const isDark=document.body.classList.toggle('dark'); document.getElementById('themeToggleBtn').innerHTML=isDark?'<i class="bi bi-sun"></i>':'<i class="bi bi-moon-stars"></i>'; localStorage.setItem(THEME_KEY,isDark?'dark':'light'); renderColorPalette(); renderGrid(); }
  document.getElementById('themeToggleBtn').addEventListener('click',toggleTheme);
  document.getElementById('searchInput').addEventListener('input',(e)=>{ currentSearchQuery=e.target.value; renderGrid(); });
  
  function showConfirm(msg,onYes,onNo){ const modal=document.getElementById('customConfirm'); document.getElementById('confirmMessage').innerText=msg; modal.style.display='flex'; const yes=document.getElementById('confirmYesBtn'), no=document.getElementById('confirmNoBtn'); const handleYes=()=>{ modal.style.display='none'; yes.removeEventListener('click',handleYes); no.removeEventListener('click',handleNo); if(onYes) onYes(); }; const handleNo=()=>{ modal.style.display='none'; yes.removeEventListener('click',handleYes); no.removeEventListener('click',handleNo); if(onNo) onNo(); }; yes.addEventListener('click',handleYes); no.addEventListener('click',handleNo); }

  // File export/import handlers
  document.getElementById('exportNotesBtn').addEventListener('click', exportToJSFile);
  const importBtn = document.getElementById('importNotesBtn');
  const importFileInput = document.getElementById('importFileInput');
  importBtn.addEventListener('click', () => importFileInput.click());
  importFileInput.addEventListener('change', (e) => { if(e.target.files[0]) importFromJSFile(e.target.files[0]); e.target.value = ''; });
  document.getElementById('clearAllBtn').addEventListener('click', () => { showConfirm("លុបកំណត់ហេតុទាំងអស់? (មិនអាចស្ដារវិញ)", () => clearAllData(), null); });
  
  // Double click logo to reset default
  document.getElementById('logoArea').addEventListener('dblclick', () => { showConfirm("ស្ដារកំណត់ហេតុដើមវិញ?", () => { loadData(); }, null); });

  loadData(); initTheme(); setTimeout(async()=>{ await getUpdates(); }, 2000);
</script>
